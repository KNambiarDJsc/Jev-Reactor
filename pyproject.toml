[project]
name = "jev-reactor"
version = "0.2.0"
description = "Real-time typed decisions around TypeSafe's Jev model, with an MCP gateway that decides every tool call before it runs."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jev Reactor contributors" }]
keywords = [
  "jev", "typesafe", "system-one", "decision", "agents", "policy",
  "mcp", "model-context-protocol", "ai-safety", "tool-calling", "guardrails",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  # 0.x SDK: pin the minor. The provider adapter is the only importer.
  "typesafe-sdk>=0.7.0,<0.8",
  # typesafe-sdk itself requires pydantic>=2.12.
  "pydantic>=2.12",
  "typer>=0.12",
  "rich>=13.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
  # v2 speaks the 2026-07-28 spec revision and every earlier one from the same server.
  "mcp>=2.2,<3",
  # imported directly (argument validation), so declared here rather than left transitive
  "jsonschema>=4.20",
]
dev = [
  "jev-reactor[mcp]",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
  "pip-audit>=2.7",
]

[project.scripts]
jev-reactor = "jev_reactor.cli:app"
jev-reactor-mcp = "jev_reactor.mcp_entry:main"

[project.urls]
Homepage = "https://github.com/KNambiarDJsc/Jev-Reactor"
Documentation = "https://github.com/KNambiarDJsc/Jev-Reactor/tree/main/docs"
Changelog = "https://github.com/KNambiarDJsc/Jev-Reactor/blob/main/CHANGELOG.md"
Issues = "https://github.com/KNambiarDJsc/Jev-Reactor/issues"
Security = "https://github.com/KNambiarDJsc/Jev-Reactor/blob/main/SECURITY.md"

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

# PyPI renders the README on its own domain, where relative links (docs/..., LICENSE) 404.
# Rewrite them to absolute GitHub URLs at build time; the README in the repo stays as is.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/KNambiarDJsc/Jev-Reactor/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/jev_reactor"]

# `jev-reactor init` copies these out of the installed package, so the README's first screen
# works after a plain `pip install` (no repository checkout needed).
[tool.hatch.build.targets.wheel.force-include]
"examples" = "jev_reactor/_data/examples"
"tests/fixtures" = "jev_reactor/_data/fixtures"
"packs" = "jev_reactor/_data/packs"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["src/jev_reactor", "tests", "packs", "examples", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[project]
name = "jev-reactor"
version = "0.1.0"
description = "An open-source event-driven runtime for typed Jev decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jev Reactor contributors" }]
keywords = ["jev", "typesafe", "system-one", "decision", "agents", "policy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  # 0.x SDK: pin the minor. The provider adapter is the only importer.
  "typesafe-sdk>=0.7.0,<0.8",
  # typesafe-sdk itself requires pydantic>=2.12.
  "pydantic>=2.12",
  "typer>=0.12",
  "rich>=13.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "pip-audit>=2.7",
]

[project.scripts]
jev-reactor = "jev_reactor.cli:app"

[project.urls]
Homepage = "https://github.com/KNambiarDJsc/Jev-Reactor"
Issues = "https://github.com/KNambiarDJsc/Jev-Reactor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_reactor"]

[tool.hatch.build.targets.sdist]
include = ["src/jev_reactor", "tests", "packs", "examples", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

# The Python definition in jev_reactor/packs/ is the source of truth; a test fails if this
# file drifts from it. To make your own pack, copy this file, change its `id`, edit the
# questions, then run `jev-reactor validate-pack <file>`.
#
# Thresholds below are documented starting points, not calibrated values. Calibrate them
# on your own traces (see docs/policy-writing.md).
id: agent-loop
version: '1.0'
description: 'Turn-level decisions: stop, ask the user, or route to a model tier.'
state:
  paths:
  - goal
  - agent_context
  - progress
  - current_tier
  trim_lists: []
questions:
  goal_satisfied:
    type: noul
    version: '1'
    tags: []
    instructions: Does `progress` already satisfy `goal`?
    criteria:
      'true': Everything `goal` asks for is already done or answered in `progress`.
      'false': Something `goal` asks for is still not done.
  needs_user_input:
    type: noul
    version: '1'
    tags: []
    instructions: Is a detail needed to continue missing from both `goal` and `progress`?
    criteria:
      'true': A needed detail is absent and only the user can supply it.
      'false': Every needed detail is present.
  model_tier:
    type: choice
    version: '1'
    tags: []
    instructions: Which kind of model is needed to write the next step of `goal`, given `progress`?
    criteria:
      fast: 'A short routine step: a lookup, a formatting change, or a simple edit.'
      standard: A normal step that needs careful reading but no deep reasoning.
      frontier: 'A hard step: design, debugging across several parts, or reasoning over many facts.'
      unclear: It is not possible to tell which kind of model is needed.
thresholds:
  goal_satisfied:
    no_below: 0.3
    yes_above: 0.85
  needs_user_input:
    no_below: 0.3
    yes_above: 0.7
  minimum_tier_confidence: 0.5
  unclear_tier: standard

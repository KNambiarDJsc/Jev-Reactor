# Generated by `jev-reactor export-pack context-retention`. Do not edit in place.
# The Python definition in jev_reactor/packs/ is the source of truth; a test fails if this
# file drifts from it. To make your own pack, copy this file, change its `id`, edit the
# questions, then run `jev-reactor validate-pack <file>`.
#
# Thresholds below are documented starting points, not calibrated values. Calibrate them
# on your own traces (see docs/policy-writing.md).
id: context-retention
version: '1.0'
description: 'Decide whether one context item should be retained, compacted, or discarded. Judgments
  only: Jev never rewrites text.'
state:
  paths:
  - goal
  - agent_context
  - item.id
  - item.role
  - item.text
  - item.age_turns
  - item.pinned
  trim_lists: []
questions:
  relevant_to_goal:
    type: noul
    version: '1'
    tags: []
    instructions: Is `item.text` relevant to `goal`?
    criteria:
      'true': '`item.text` is about something `goal` still involves.'
      'false': '`item.text` is about something unrelated to `goal`.'
  states_preference:
    type: noul
    version: '1'
    tags: []
    instructions: Does `item.text` state a preference or standing instruction from the user that should
      keep applying?
    criteria:
      'true': The user says how they want things done from now on.
      'false': The text states no lasting preference or instruction.
  open_commitment:
    type: noul
    version: '1'
    tags: []
    instructions: Does `item.text` contain a promise, task, or question that is still unresolved?
    criteria:
      'true': Something was promised or asked and has not been done or answered yet.
      'false': Nothing in the text is left open.
  needed_evidence:
    type: noul
    version: '1'
    tags: []
    instructions: Does `item.text` contain a fact, value, or result that a later answer about `goal`
      may need to quote exactly?
    criteria:
      'true': The text holds specific values, names, or results that must stay exact.
      'false': The text holds nothing that would need to be quoted exactly.
  sensitive:
    type: noul
    version: '1'
    tags: []
    instructions: Does `item.text` contain personal, financial, or credential information?
    criteria:
      'true': The text includes such information.
      'false': The text includes no such information.
  safe_to_summarize:
    type: noul
    version: '1'
    tags: []
    instructions: Would a one-sentence summary of `item.text` keep everything `goal` still needs from
      it?
    criteria:
      'true': A short summary loses nothing that `goal` needs.
      'false': A summary would lose detail that `goal` needs.
  safe_to_discard:
    type: noul
    version: '1'
    tags: []
    instructions: Could `item.text` be deleted with no effect on `goal` or on anything the user asked
      for?
    criteria:
      'true': Deleting it changes nothing that matters.
      'false': Deleting it would lose something that matters.
  preservation_need:
    type: score
    version: '1'
    tags: []
    instructions: How much of the exact content of `item.text` does `goal` still need?
    criteria:
    - 'None of it: the item is unrelated to `goal`, out of date, or fully replaced by later items.'
    - 'Only the gist: the outcome matters, but exact wording, numbers, and names do not.'
    - 'The exact content: specific values, names, wording, instructions, or commitments must survive
      unchanged.'
thresholds:
  retain_signal:
    no_below: 0.3
    yes_above: 0.7
  discard_signal:
    no_below: 0.3
    yes_above: 0.7
  summarize_signal:
    no_below: 0.3
    yes_above: 0.7
  retain_score_at: 1.5
  discard_score_at: 0.5
  minimum_score_confidence: 0.6
  keep_recent_turns: 4

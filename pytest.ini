[pytest]
minversion = 8.0
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    live: calls the real TypeSafe API (needs TYPESAFE_API_KEY and TYPESAFE_LIVE_TESTS=1)
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
